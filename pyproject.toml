[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurojepa-adni-audit"
version = "0.1.0"
description = "Reproducible longitudinal audit of frozen vision foundation model features (Neuro-JEPA, DINOv3, BrainIAC) on ADNI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "lifelines>=0.30,<1",
  "torch>=2.1,<3",
  "monai>=1.5,<2",
  "nibabel>=5,<6",
  "huggingface-hub>=1,<2",
  "safetensors>=0.5,<1",
  "torchmetrics>=1,<2",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# DINOv3 extraction (protocol 0.6.0 records transformers 5.12.1); BrainIAC needs only monai.
encoders = ["transformers>=5.12,<6"]
survival-neural-legacy = ["pycox>=0.3,<1", "torchtuples>=0.2,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --disable-warnings"
